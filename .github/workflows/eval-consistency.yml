# SUPERSEDED by tests.yml, which runs the full test suite (including the
# eval-consistency + grading-file audit that used to run here) on every push
# and PR, and gates the Pages deploy. This file is kept only as a manual
# escape hatch; feel free to delete it.
name: Eval Results Consistency (superseded)

on:
  workflow_dispatch:

jobs:
  eval-consistency:
    name: Cross-file + grading-file eval audit (manual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run eval consistency + grading-file audit
        run: pytest tests/test_eval_consistency.py -v --tb=short
